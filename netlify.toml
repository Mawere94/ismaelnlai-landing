# Netlify config — ismaelnlai.com

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP en bloqueo desde el 26/10/2026. Antes estuvo en Report-Only; el recorrido real
    # dio 0 infracciones: portada sin cookies, Calendly abierto, HubSpot cargado tras
    # aceptar y las 9 páginas. Si se añade un servicio externo, su dominio va aquí o
    # el navegador lo bloquea sin avisar.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com https://*.hs-scripts.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hscollectedforms.net https://*.usemessages.com https://*.hubspot.com https://*.hsforms.net; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://n8n.ismaelnlai.com https://*.hubspot.com https://*.hubapi.com https://*.hs-banner.com https://*.hscollectedforms.net https://*.hsforms.com https://*.hs-analytics.net https://*.calendly.com; frame-src https://calendly.com https://*.calendly.com https://*.hubspot.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# llms.txt servido como texto plano
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Las tipografías no cambian: caché larga
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Una sola URL por página. Netlify sirve /sobre-mi y /sobre-mi.html con 200,
# y eso son dos URLs con el mismo contenido para Google. La buena es la limpia.
# force = true hace falta porque el .html existe como archivo y, sin él, gana el archivo.
[[redirects]]
  from = "/sobre-mi.html"
  to = "/sobre-mi"
  status = 301
  force = true

